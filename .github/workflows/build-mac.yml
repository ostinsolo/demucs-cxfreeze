name: build-mac
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac-intel:
    name: Build demucs-cxfreeze for macOS Intel
    runs-on: macos-13  # Intel runner (free)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Python 3.11 like stemrollerapp
      # Use latest cx-Freeze like stemrollerapp, just add diffq for quantized models
      - run: pip install torch torchvision torchaudio demucs SoundFile cx-Freeze diffq
      - run: cxfreeze main.py --target-dir=demucs-cxfreeze-mac-intel --target-name=demucs-cxfreeze --packages=torch --includes=demucs.htdemucs,diffq
      # Test before packaging
      - run: |
          chmod +x demucs-cxfreeze-mac-intel/demucs-cxfreeze
          ./demucs-cxfreeze-mac-intel/demucs-cxfreeze --help
      - run: ditto -c -k --sequesterRsrc --keepParent demucs-cxfreeze-mac-intel demucs-cxfreeze-mac-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: demucs-cxfreeze-mac-intel
          path: demucs-cxfreeze-mac-intel.zip

  build-mac-arm:
    name: Build demucs-cxfreeze for macOS ARM (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Python 3.11 like stemrollerapp
      # Use latest cx-Freeze like stemrollerapp, just add diffq for quantized models
      - run: pip install torch torchvision torchaudio demucs SoundFile cx-Freeze diffq
      - run: cxfreeze main.py --target-dir=demucs-cxfreeze-mac-arm --target-name=demucs-cxfreeze --packages=torch --includes=demucs.htdemucs,diffq
      # Test before packaging
      - run: |
          chmod +x demucs-cxfreeze-mac-arm/demucs-cxfreeze
          ./demucs-cxfreeze-mac-arm/demucs-cxfreeze --help
      - run: ditto -c -k --sequesterRsrc --keepParent demucs-cxfreeze-mac-arm demucs-cxfreeze-mac-arm.zip
      - uses: actions/upload-artifact@v4
        with:
          name: demucs-cxfreeze-mac-arm
          path: demucs-cxfreeze-mac-arm.zip

  release:
    name: Create Release
    needs: [build-mac-intel, build-mac-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demucs-cxfreeze-mac-intel
          path: ./artifacts
      - uses: actions/download-artifact@v4
        with:
          name: demucs-cxfreeze-mac-arm
          path: ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: v1.2.0 - Fixed build with proper version pins
          body: |
            ## Demucs-cxfreeze v1.2.0 - Fixed Build
            
            Standalone frozen Demucs binary with **diffq** support for quantized models.
            
            ### Changes in v1.2.0
            - Fixed PyTorch JIT warnings by pinning correct dependency versions
            - Python 3.10 (more stable for freezing)
            - einops<0.7 (avoids torch._dynamo source inspection errors)
            - cx_Freeze==6.15.0 (avoids bytecode bugs in newer versions)
            - numpy<2 (prevents numpy.core.multiarray error)
            
            ### Supported Models
            - htdemucs, htdemucs_ft, htdemucs_6s, hdemucs_mmi
            - mdx, mdx_extra
            - **mdx_q, mdx_extra_q** (quantized models - require diffq)
            
            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | macOS Intel | demucs-cxfreeze-mac-intel.zip | For Intel Macs |
            | macOS ARM | demucs-cxfreeze-mac-arm.zip | For Apple Silicon (M1/M2/M3) |
            
            ### Credits
            - [stemrollerapp/demucs-cxfreeze](https://github.com/stemrollerapp/demucs-cxfreeze) - Original frozen binary
            - [facebookresearch/demucs](https://github.com/facebookresearch/demucs) - Original Demucs library
          files: |
            ./artifacts/demucs-cxfreeze-mac-intel.zip
            ./artifacts/demucs-cxfreeze-mac-arm.zip
          draft: false
          prerelease: false
