name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows-cuda:
    name: Build demucs-cxfreeze for Windows (CUDA)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Python 3.11 like stemrollerapp
      # Pin to exact versions matching stemrollerapp (April 2024)
      # Install cx-Freeze from PyPI first (not from PyTorch index)
      - run: pip install "numpy<2" "cx-Freeze==6.15.16"
      - run: pip install "torch==2.2.2+cu121" "torchvision==0.17.2+cu121" "torchaudio==2.2.2+cu121" --index-url https://download.pytorch.org/whl/cu121
      - run: pip install demucs SoundFile diffq
      - run: cxfreeze main.py --target-dir=demucs-cxfreeze-win-cuda --target-name=demucs-cxfreeze --packages=torch --includes=demucs.htdemucs,diffq
      # Test before packaging
      - run: .\demucs-cxfreeze-win-cuda\demucs-cxfreeze.exe --help
      - run: Invoke-WebRequest -Uri https://www.7-zip.org/a/7zr.exe -OutFile 7zr.exe
      - run: Invoke-WebRequest -Uri https://www.7-zip.org/a/7z2201-x64.exe -OutFile 7zInstaller-x64.exe
      - run: .\7zr.exe x "7zInstaller-x64.exe"
      - run: .\7z.exe a -m0=lzma2 -mmt=on -mx=9 "demucs-cxfreeze-win-cuda.7z" "demucs-cxfreeze-win-cuda"
      - uses: actions/upload-artifact@v4
        with:
          name: demucs-cxfreeze-win-cuda
          path: demucs-cxfreeze-win-cuda.7z

  build-windows-cpu:
    name: Build demucs-cxfreeze for Windows (CPU only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Python 3.11 like stemrollerapp
      # Pin to exact versions matching stemrollerapp (April 2024)
      # Install cx-Freeze from PyPI first (not from PyTorch index)
      - run: pip install "numpy<2" "cx-Freeze==6.15.16"
      - run: pip install "torch==2.2.2+cpu" "torchvision==0.17.2+cpu" "torchaudio==2.2.2+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install demucs SoundFile diffq
      - run: cxfreeze main.py --target-dir=demucs-cxfreeze-win-cpu --target-name=demucs-cxfreeze --packages=torch --includes=demucs.htdemucs,diffq
      # Test before packaging
      - run: .\demucs-cxfreeze-win-cpu\demucs-cxfreeze.exe --help
      - run: Compress-Archive -Path demucs-cxfreeze-win-cpu -DestinationPath demucs-cxfreeze-win-cpu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: demucs-cxfreeze-win-cpu
          path: demucs-cxfreeze-win-cpu.zip

  release:
    name: Create Release
    needs: [build-windows-cuda, build-windows-cpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demucs-cxfreeze-win-cuda
          path: ./artifacts
      - uses: actions/download-artifact@v4
        with:
          name: demucs-cxfreeze-win-cpu
          path: ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-win
          name: v1.4.0 Windows - No more warnings
          body: |
            ## Demucs-cxfreeze v1.4.0 Windows - Clean Output
            
            Standalone frozen Demucs binary with **diffq** support for quantized models.
            
            ### Changes in v1.4.0
            - **FIX**: Pin cx-Freeze==6.15.16 - includes .py source files, eliminating torch JIT warnings
            - Pin numpy<2 - NumPy 2.x breaks PyTorch
            - Python 3.11 (matching stemrollerapp)
            - Includes diffq for quantized model support
            
            ### Supported Models
            - htdemucs, htdemucs_ft, htdemucs_6s, hdemucs_mmi
            - mdx, mdx_extra
            - **mdx_q, mdx_extra_q** (quantized models - require diffq)
            
            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows CUDA | demucs-cxfreeze-win-cuda.7z | GPU accelerated |
            | Windows CPU | demucs-cxfreeze-win-cpu.zip | CPU only |
            
            ### Credits
            - [stemrollerapp/demucs-cxfreeze](https://github.com/stemrollerapp/demucs-cxfreeze) - Original frozen binary
            - [facebookresearch/demucs](https://github.com/facebookresearch/demucs) - Original Demucs library
          files: |
            ./artifacts/demucs-cxfreeze-win-cuda.7z
            ./artifacts/demucs-cxfreeze-win-cpu.zip
          draft: false
          prerelease: false
